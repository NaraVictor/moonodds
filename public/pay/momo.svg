<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" role="img" aria-label="MoMo">
  <!--
    MTN MoMo, rebuilt to spec: all caps, plain yellow field, and the "from MTN"
    lockup underneath dropped. Brand colours are MTN's own — #FFCB05 yellow,
    #004F9F blue.
  -->
  <rect width="96" height="32" rx="5" fill="#FFCB05"/>
  <text x="48" y="22.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.4" fill="#004F9F">MOMO</text>
</svg>
